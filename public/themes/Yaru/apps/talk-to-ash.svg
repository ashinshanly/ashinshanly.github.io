<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="512" height="512">
  <defs>
    <linearGradient id="ashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091124" />
      <stop offset="50%" stop-color="#060A14" />
      <stop offset="100%" stop-color="#140D2B" />
    </linearGradient>
    <radialGradient id="ashAura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#060A14" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ashOrb" cx="35%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="28%" stop-color="#E0F7FE" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="86%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </radialGradient>
    <linearGradient id="ashRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Outer Squircle -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#ashBg)" stroke="rgba(34,211,238,0.35)" stroke-width="3" />

  <!-- Voice Aura Glow -->
  <circle cx="128" cy="124" r="100" fill="url(#ashAura)" />

  <!-- Outer Acoustic Wave Rings -->
  <circle cx="128" cy="124" r="84" fill="none" stroke="url(#ashRing)" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 8" />
  <circle cx="128" cy="124" r="70" fill="none" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="2" />

  <!-- Floor Contact Shadow -->
  <ellipse cx="128" cy="204" rx="44" ry="8" fill="#000000" opacity="0.45" />

  <!-- Main Iridescent Liquid Orb -->
  <circle cx="128" cy="124" r="56" fill="url(#ashOrb)" stroke="rgba(255,255,255,0.75)" stroke-width="2.5" />

  <!-- Top-Left Specular Glass Highlight -->
  <ellipse cx="106" cy="98" rx="20" ry="11" transform="rotate(-26 106 98)" fill="#FFFFFF" opacity="0.72" />

  <!-- Ash's Expressive Pill Eyes -->
  <rect x="104" y="109" width="11" height="24" rx="5.5" fill="#0F172A" />
  <circle cx="107.5" cy="115" r="2.2" fill="#FFFFFF" opacity="0.9" />

  <rect x="141" y="109" width="11" height="24" rx="5.5" fill="#0F172A" />
  <circle cx="144.5" cy="115" r="2.2" fill="#FFFFFF" opacity="0.9" />

  <!-- Bottom Voice Equalizer Pill Indicator -->
  <g transform="translate(128, 204)">
    <rect x="-26" y="-8" width="52" height="16" rx="8" fill="#0F172A" stroke="rgba(34,211,238,0.5)" stroke-width="1.5" />
    <line x1="-12" y1="-3" x2="-12" y2="3" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-4" y1="-5" x2="-4" y2="5" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="4" y1="-4" x2="4" y2="4" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round" />
    <line x1="12" y1="-2.5" x2="12" y2="2.5" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
