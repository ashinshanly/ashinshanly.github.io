<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="512" height="512">
  <defs>
    <linearGradient id="luminaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#070B19" />
      <stop offset="100%" stop-color="#130F26" />
    </linearGradient>
    <radialGradient id="nebulaMint" cx="30%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#7EDDB5" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#7EDDB5" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebulaLavender" cx="72%" cy="74%" r="55%">
      <stop offset="0%" stop-color="#B8A9E8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#B8A9E8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pulsarCore" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FFF6D6" />
      <stop offset="70%" stop-color="#7EDDB5" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="constellationLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7EDDB5" />
      <stop offset="50%" stop-color="#F5D76E" />
      <stop offset="100%" stop-color="#FF7B7B" />
    </linearGradient>
  </defs>

  <!-- Outer Squircle -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#luminaBg)" stroke="rgba(126,221,181,0.28)" stroke-width="3" />

  <!-- Cosmic Nebulae -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#nebulaMint)" />
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#nebulaLavender)" />

  <!-- Subtle Outer Dashed Orbit -->
  <circle cx="128" cy="128" r="84" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="4 7" />

  <!-- Tilted Pulsar Halo Rings -->
  <g transform="translate(128,128) rotate(-28)">
    <ellipse cx="0" cy="0" rx="76" ry="30" fill="none" stroke="#7EDDB5" stroke-opacity="0.55" stroke-width="2.5" />
  </g>
  <g transform="translate(128,128) rotate(32)">
    <ellipse cx="0" cy="0" rx="76" ry="30" fill="none" stroke="#B8A9E8" stroke-opacity="0.55" stroke-width="2.5" />
  </g>

  <!-- Constellation Path Connecting Nodes -->
  <polyline
    points="68,84 128,56 190,88 128,128 74,174 134,198 186,164"
    fill="none"
    stroke="url(#constellationLine)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.88"
  />

  <!-- Central Pulsar Glow & Core -->
  <circle cx="128" cy="128" r="34" fill="url(#pulsarCore)" opacity="0.65" />
  <circle cx="128" cy="128" r="18" fill="#FFFFFF" stroke="#7EDDB5" stroke-width="3" />
  <path d="M128 98 L132 124 L158 128 L132 132 L128 158 L124 132 L98 128 L124 124 Z" fill="#FFFFFF" opacity="0.92" />

  <!-- Satellite Pulsar Nodes -->
  <!-- Node 1: Mint -->
  <circle cx="68" cy="84" r="11" fill="#7EDDB5" fill-opacity="0.28" />
  <circle cx="68" cy="84" r="6.5" fill="#7EDDB5" stroke="#FFFFFF" stroke-width="2" />

  <!-- Node 2: Golden -->
  <circle cx="128" cy="56" r="11" fill="#F5D76E" fill-opacity="0.28" />
  <circle cx="128" cy="56" r="6.5" fill="#F5D76E" stroke="#FFFFFF" stroke-width="2" />

  <!-- Node 3: Coral -->
  <circle cx="190" cy="88" r="11" fill="#FF7B7B" fill-opacity="0.28" />
  <circle cx="190" cy="88" r="6.5" fill="#FF7B7B" stroke="#FFFFFF" stroke-width="2" />

  <!-- Node 4: Sky -->
  <circle cx="74" cy="174" r="10" fill="#87CEEB" fill-opacity="0.28" />
  <circle cx="74" cy="174" r="6" fill="#87CEEB" stroke="#FFFFFF" stroke-width="2" />

  <!-- Node 5: Lavender -->
  <circle cx="134" cy="198" r="10" fill="#B8A9E8" fill-opacity="0.28" />
  <circle cx="134" cy="198" r="6" fill="#B8A9E8" stroke="#FFFFFF" stroke-width="2" />

  <!-- Node 6: Peach -->
  <circle cx="186" cy="164" r="10" fill="#FFAB76" fill-opacity="0.28" />
  <circle cx="186" cy="164" r="6" fill="#FFAB76" stroke="#FFFFFF" stroke-width="2" />
</svg>
