<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="gbBg" x1="36" y1="28" x2="476" y2="484" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A103C" />
      <stop offset="52%" stop-color="#0E0B20" />
      <stop offset="100%" stop-color="#070510" />
    </linearGradient>
    <linearGradient id="gbRim" x1="28" y1="28" x2="484" y2="484" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#F43F5E" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="88" y1="96" x2="404" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B3A" />
      <stop offset="100%" stop-color="#121026" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="pinkGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#00FF66" />
    </linearGradient>
    <linearGradient id="yellowGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="penBody" x1="296" y1="296" x2="432" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <filter id="neonBloom" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#gbBg)" />
  <rect x="31" y="31" width="450" height="450" rx="109" stroke="url(#gbRim)" stroke-width="6" />

  <!-- Book Shadow & Back Cover -->
  <rect x="92" y="102" width="308" height="320" rx="36" fill="#090714" opacity="0.7" />
  <rect x="84" y="92" width="308" height="320" rx="34" fill="url(#pageGrad)" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="4" />

  <!-- GuestBook Left Binding Rings -->
  <g fill="#38BDF8">
    <rect x="68" y="140" width="32" height="14" rx="7" />
    <rect x="68" y="210" width="32" height="14" rx="7" />
    <rect x="68" y="280" width="32" height="14" rx="7" />
    <rect x="68" y="350" width="32" height="14" rx="7" />
  </g>

  <!-- Pixel Art Heart / Mural Mosaic Inside GuestBook -->
  <g filter="url(#neonBloom)">
    <!-- Row 1 of Pixel Heart -->
    <rect x="154" y="142" width="36" height="36" rx="8" fill="url(#pinkGlow)" />
    <rect x="196" y="142" width="36" height="36" rx="8" fill="url(#pinkGlow)" />
    <rect x="260" y="142" width="36" height="36" rx="8" fill="url(#cyanGlow)" />
    <rect x="302" y="142" width="36" height="36" rx="8" fill="url(#cyanGlow)" />

    <!-- Row 2 -->
    <rect x="132" y="184" width="36" height="36" rx="8" fill="url(#pinkGlow)" />
    <rect x="174" y="184" width="36" height="36" rx="8" fill="url(#yellowGlow)" />
    <rect x="216" y="184" width="36" height="36" rx="8" fill="#FFFFFF" />
    <rect x="258" y="184" width="36" height="36" rx="8" fill="url(#greenGlow)" />
    <rect x="300" y="184" width="36" height="36" rx="8" fill="url(#cyanGlow)" />

    <!-- Row 3 -->
    <rect x="154" y="226" width="36" height="36" rx="8" fill="url(#yellowGlow)" />
    <rect x="196" y="226" width="36" height="36" rx="8" fill="url(#pinkGlow)" />
    <rect x="238" y="226" width="36" height="36" rx="8" fill="url(#cyanGlow)" />
    <rect x="280" y="226" width="36" height="36" rx="8" fill="url(#greenGlow)" />

    <!-- Row 4 -->
    <rect x="196" y="268" width="36" height="36" rx="8" fill="url(#greenGlow)" />
    <rect x="238" y="268" width="36" height="36" rx="8" fill="url(#yellowGlow)" />

    <!-- Row 5 (Tip) -->
    <rect x="217" y="310" width="36" height="36" rx="8" fill="url(#cyanGlow)" />
  </g>

  <!-- Signature Wave Line at Bottom of Book -->
  <path
    d="M128 372 Q 164 354, 198 372 T 268 370"
    stroke="#67E8F9"
    stroke-width="6"
    stroke-linecap="round"
    opacity="0.8"
  />

  <!-- Glowing Neon Stylus / Pen Writing on the GuestBook -->
  <g transform="rotate(42 268 370)" filter="url(#neonBloom)">
    <rect x="248" y="185" width="40" height="149" rx="14" fill="url(#penBody)" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="3" />
    <polygon points="248,330 288,330 268,370" fill="#FDE047" />
    <circle cx="268" cy="370" r="6" fill="#FFFFFF" />
  </g>
</svg>
